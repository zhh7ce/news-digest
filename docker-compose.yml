# news-digest 单容器部署：只跑常驻定时器，每天到点起一轮流水线，跑完把产物推到 GitHub Pages。
# 这个模式不起 HTTP 服务，对外只有 https://<用户名>.github.io/static/news-digest/feed.xml。
#
#   1. cp .env.example .env，把里面的值改成 NAS 上实际要跑的（密钥和普通配置都在这一处）
#   2. docker compose up -d --build
#      docker compose logs -f            看每轮起止和推送结果
#
# 定时点由 .env 的 SCHEDULE_TIME（HH:MM）决定，TZ 必须是 Asia/Shanghai，
# 否则容器按 UTC 计时，02:00 等于北京时间 10:00，output/ 里带分钟的文件名也差 8 小时。
# 所有运行参数只从 .env 经 env_file 注入，compose 不兜底默认值，改配置就改 .env、不用重新 build。
# 网络用 host 只是为了让容器里的 127.0.0.1:7890 等于 NAS 自己的代理；
# 换成桥接网络就得把 .env 里的代理填成 NAS 的局域网地址。
# 卷挂在宿主机 ./output 和 ./state，容器里以 uid 1000(node) 运行；
# 飞牛NAS 上若报权限错，先在宿主机 chown -R 1000:1000 output state。
services:
  news-digest:
    build: .
    image: news-digest:latest
    container_name: news-digest
    # loop = 只跑定时器；up = 定时器 + 对外发 HTTP feed；见 scripts/docker-entrypoint.sh
    command: ["loop"]
    env_file: .env
    network_mode: host
    volumes:
      - ./output:/app/output
      - ./state:/app/state
    restart: unless-stopped
    logging:
      # 长跑服务，限制日志体积，别把 NAS 磁盘写满
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
