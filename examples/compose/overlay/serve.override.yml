# 覆盖 base.yml：只对外发 HTTP，容器自己不跑流水线。
# 定时逻辑放宿主那边（飞牛计划任务 / crontab 每天 docker compose run --rm news-digest），
# output/ 必须和写产物的那个进程共享同一份挂载目录，否则这里发的一直是旧文件。
# 用法见 base.yml 顶部。

services:
  news-digest:
    container_name: news-digest-serve
    command: ["serve"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.SERVE_PORT||2345)+'/').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
