# news-digest 部署模板之一：只把 output/ 里现有的产物推上 GitHub Pages（入口 publish），不跑流水线。
# 用于"feed 早就生成好了，现在只想补推一次"，或者验证 PAGES_* 配置和 PAT 权限对不对。
#
# 用法：
#   cp examples/compose/publish.yml ./docker-compose.yml
#   docker compose run --rm news-digest
#
# .env 里 PAGES_REPO / PAGES_DIR / PAGES_TOKEN 缺任何一个不会报错，只打一行"未配置 Pages，跳过"。
# 想确认会不会真的发出去、又不想动 GitHub：把 PAGES_API_BASE 指到一个没在监听的端口，
# 它会在 GET sha 那一步失败并打 [pages] 发布失败。

services:
  news-digest:
    build: .
    image: news-digest:latest
    command: ["publish"]
    env_file: .env
    network_mode: host
    volumes:
      - ./output:/app/output
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
