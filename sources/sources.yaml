# 订阅源清单：feed 的 id、名称、URL 与兜底类别。
# 顺序即声明顺序——代表条目选取、事件内成员排序与每源截断都按它来，调整行序就改变优先级。
# 由 src/lib/config.ts 从「feeds.yaml 同目录下的 sources/sources.yaml」读取；换一套配置用 FEEDS_CONFIG 指过去即可。
#
# category 只是 AI 没给出归类时的兜底归属，正常情况由逐条调用决定。
# 自建 RSSHub（192.168.10.123:1200）的 URL 统一带 ?limit=30：让实例只渲染要用的条数，
# 否则它默认渲染 100 条逐篇抓原文，冷缓存时一次响应会超时。
